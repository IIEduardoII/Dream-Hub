worker_processes 1;
pid /data/data/com.termux/files/home/.local/share/nexus/nginx.pid;
error_log /data/data/com.termux/files/home/.local/share/nexus/nginx-error.log warn;

events { worker_connections 128; }

http {
    include /data/data/com.termux/files/usr/etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /data/data/com.termux/files/home/.local/share/nexus/nginx-access.log;
    sendfile on;
    server_names_hash_bucket_size 128;

    # HTTP na porta 8090 (Retrocompatibilidade interna / Tailscale)
    server {
        listen 0.0.0.0:8090;
        server_name _;

        allow 100.64.0.0/10;
        allow 127.0.0.1;
        deny all;

        include /data/data/com.termux/files/home/nexus-termux/nginx-nexus-common.conf;
    }

    # HTTPS Oficial na porta 8445 (DuckDNS + Let's Encrypt DNS-01 / WebAPK PWA)
    server {
        listen 0.0.0.0:8445 ssl;
        http2 on;
        server_name __DUCKDNS_DOMAIN__ 100.107.212.104 localhost;

        allow 100.64.0.0/10;
        allow 127.0.0.1;
        deny all;

        ssl_certificate     /data/data/com.termux/files/home/nexus-termux/certs/server.crt;
        ssl_certificate_key /data/data/com.termux/files/home/nexus-termux/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:NexusSSL:2m;
        ssl_session_timeout 1d;

        include /data/data/com.termux/files/home/nexus-termux/nginx-nexus-common.conf;
    }
}
