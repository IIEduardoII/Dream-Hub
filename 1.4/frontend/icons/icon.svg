<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090b10"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="160" stroke="#232b3b" stroke-width="8" fill="none"/>
  
  <!-- Central Hub Node -->
  <circle cx="256" cy="256" r="28" fill="#f8fafc"/>
  
  <!-- 4 Pillars Connected Nodes -->
  <!-- Top: Tasks (Cyan) -->
  <line x1="256" y1="256" x2="256" y2="136" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="136" r="24" fill="#38bdf8"/>
  
  <!-- Right: Time (Amber) -->
  <line x1="256" y1="256" x2="376" y2="256" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <circle cx="376" cy="256" r="24" fill="#fbbf24"/>
  
  <!-- Bottom: Finance (Emerald) -->
  <line x1="256" y1="256" x2="256" y2="376" stroke="#34d399" stroke-width="6" stroke-linecap="round"/>
  <circle cx="256" cy="376" r="24" fill="#34d399"/>
  
  <!-- Left: Ideas (Purple) -->
  <line x1="256" y1="256" x2="136" y2="256" stroke="#a78bfa" stroke-width="6" stroke-linecap="round"/>
  <circle cx="136" cy="256" r="24" fill="#a78bfa"/>
</svg>
